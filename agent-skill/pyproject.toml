[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gds-collab-skill"
version = "0.1.0"
description = "AI agent skill for the GDS Collab Platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
]

[project.scripts]
gds-collab-skill = "gds_collab_skill.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
