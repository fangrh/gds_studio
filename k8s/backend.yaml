apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gds-collab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/fangrh/gds_studio/backend:sha-8b0755bcf703bb9ecc36e5dc7ae77736aae98303
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: GDS_COLLAB_DB
              value: /data/db/gds_collab.db
            - name: GDS_PROJECTS_DIR
              value: /data/projects
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: db
              mountPath: /data/db
            - name: scripts
              mountPath: /data/scripts
              readOnly: true
            - name: gds
              mountPath: /data/gds
            - name: projects
              mountPath: /data/projects
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: db-pvc
        - name: scripts
          persistentVolumeClaim:
            claimName: scripts-pvc
        - name: gds
          persistentVolumeClaim:
            claimName: gds-pvc
        - name: projects
          persistentVolumeClaim:
            claimName: projects-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gds-collab
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
